
<!DOCTYPE html>
<html>
<head>
    <title>Add Patient</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Patient Registration</h1>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Enter Patient Name"
               required>

        <input type="number"
               name="age"
               placeholder="Enter Age"
               min="0"
               max="120"
               required>

        <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <input type="text"
               name="disease"
               placeholder="Enter Sample Medical Information">

        <button type="submit">Save Patient</button>

    </form>

    <a href="/">Back Home</a>

</div>

</body>
</html>
