
<!DOCTYPE html>
<html>
<head>
    <title>Medical Record System Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Medical Record System</h1>

    <h2>User Login</h2>

    <form method="POST" action="/login">

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
